# Business Profile listing title (reviews_poller._store_label). Ported from the
# frontend STORE_SEGMENTS map (storeSegments.js). `type` is FOFO (Franchise-Owned
# Franchise-Operated) or COCO (Company-Owned Company-Operated); `name` is the
# human display name shown in the report. Human-editable: to reclassify or rename
# a store, edit its entry here.
