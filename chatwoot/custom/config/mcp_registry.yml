    action: api/v1/accounts/canned_responses#create
    route: POST /api/v1/accounts/:account_id/canned_responses
    title: "Create a canned response"
    description: "Creates a saved reply: a short code and the text it expands to."
    who: everyone
    args:
      - {name: "short_code", in: "body", type: "string", required: true, description: "The short code agents type after a slash."}
      - {name: "content", in: "body", type: "string", required: true, maxLength: 5000, description: "The reply text."}
