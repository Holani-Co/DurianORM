    action: api/v1/accounts/canned_responses#update
    route: PATCH /api/v1/accounts/:account_id/canned_responses/:id
    title: "Update a canned response"
    description: "Changes a saved reply's short code or text."
    who: everyone
    idempotent: true
    args:
      - {name: "canned_response_id", in: "path", param: "id", type: "integer", required: true}
      - {name: "short_code", in: "body", type: "string"}
