# ORM's AI tool registry (docs/mcp/MCP.md, section 8): every route Rails mounts, listed exactly once.
#
# - read: offered to AI connections (Durian OS shows them as orm__<name>). A read is GET, or POST with a `post:`
#   reason (it only looks up or validates). `who`: everyone | admin | reports | kb (section 6). `feature`: listed in
#   ai/me only while that account feature is on. `account_param`: where the managed account is in the path
#   (default account_id; none for ai#me). `args`: what the MCP server offers and checks (section 11.1).
# - write: listed with its future name, refused (403) for every AI connection in v1.
# - web_only: reason => keys; browser only, never a tool. The words for each reason are in
#   DurianOs::Ai::Registry::WEB_ONLY_REASONS and the design page, section 11.4.
#
# Keys are `controller#action` as `bin/rails routes` prints them; `mount /path` for mounted Rack apps and engines;
# `VERB /path` for redirect routes. spec/custom/config/mcp_registry_spec.rb fails on a mounted route that is not
# listed, a key listed twice or a key no longer mounted. After changing a read, run
# `bundle exec rake durian_os:mcp_tools` (writes ../mcp_server/tools.json) and name the tool on the design page.
version: 1
read:
  - name: get_my_orm_access
    action: api/v1/ai#me
    route: GET /api/v1/ai/me
    title: "Show who this connection acts as"
    description: "Who this connection acts as in ORM: the person, their own role and the role after the connection's ceiling, their inboxes and teams, and the tools it may call. Whether it may change things (Full access) shows in read_only."
    who: everyone
    account_param: none
  - name: get_account_settings
    action: api/v1/accounts#show
    route: GET /api/v1/accounts/:id
    title: "Show the account settings"
    description: "The Durian account in ORM: its name, language, support email, enabled features and account settings."
    who: everyone
    account_param: id
  - name: list_conversations
    action: api/v1/accounts/conversations#index
    route: GET /api/v1/accounts/:account_id/conversations
    title: "List conversations"
    description: "Conversations as the inbox screen lists them: by status, assignee (mine, unassigned, all), inbox, team, labels and conversation type, 25 per page, with counts. Only conversations the person can see."
    who: everyone
    args:
      - {name: status, in: query, type: "string", enum: ["open", "resolved", "pending", "snoozed", "all"], description: "Conversation status; open unless given."}
      - {name: assignee_type, in: query, type: "string", enum: ["me", "unassigned", "assigned", "all"], description: "Whose conversations."}
      - {name: inbox_id, in: query, type: "integer", description: "Only this inbox."}
      - {name: team_id, in: query, type: "integer", description: "Only this team."}
      - {name: labels, in: query, type: "array", items: "string", description: "Only conversations with any of these labels."}
      - {name: conversation_type, in: query, type: "string", enum: ["mention", "participating", "unattended"], description: "A special view."}
      - {name: sort_by, in: query, type: "string", enum: ["last_activity_at_desc", "last_activity_at_asc", "created_at_desc", "created_at_asc", "priority_desc", "priority_asc", "waiting_since_desc", "waiting_since_asc"]}
      - {name: updated_within, in: query, type: "integer", description: "Only conversations updated in the last N seconds."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: count_conversations
    action: api/v1/accounts/conversations#meta
    route: GET /api/v1/accounts/:account_id/conversations/meta
    title: "Count conversations"
    description: "How many conversations match the inbox screen's filters: mine, assigned, unassigned and all. Only conversations the person can see."
    who: everyone
    args:
      - {name: status, in: query, type: "string", enum: ["open", "resolved", "pending", "snoozed", "all"], description: "Conversation status; open unless given."}
      - {name: assignee_type, in: query, type: "string", enum: ["me", "unassigned", "assigned", "all"], description: "Whose conversations."}
      - {name: inbox_id, in: query, type: "integer", description: "Only this inbox."}
      - {name: team_id, in: query, type: "integer", description: "Only this team."}
      - {name: labels, in: query, type: "array", items: "string", description: "Only conversations with any of these labels."}
      - {name: conversation_type, in: query, type: "string", enum: ["mention", "participating", "unattended"], description: "A special view."}
  - name: find_conversations_with_text
    action: api/v1/accounts/conversations#search
    route: GET /api/v1/accounts/:account_id/conversations/search
    title: "Find conversations by message text"
    description: "Conversations whose messages contain the given text, with the inbox screen's status, inbox and assignee filters. Only conversations the person can see."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: status, in: query, type: "string", enum: ["open", "resolved", "pending", "snoozed", "all"], description: "Conversation status; open unless given."}
      - {name: assignee_type, in: query, type: "string", enum: ["me", "unassigned", "assigned", "all"], description: "Whose conversations."}
      - {name: inbox_id, in: query, type: "integer", description: "Only this inbox."}
      - {name: team_id, in: query, type: "integer", description: "Only this team."}
      - {name: labels, in: query, type: "array", items: "string", description: "Only conversations with any of these labels."}
      - {name: conversation_type, in: query, type: "string", enum: ["mention", "participating", "unattended"], description: "A special view."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: filter_conversations
    action: api/v1/accounts/conversations#filter
    route: POST /api/v1/accounts/:account_id/conversations/filter
    title: "Filter conversations"
    description: "Conversations matching conditions on status, assignee, inbox, team, labels, priority, dates, contact or custom attributes, as the screen's filter builds them. Only conversations the person can see."
    who: everyone
    post: "the body is the filter; it creates nothing"
    args:
      - {name: payload, in: body, type: "array", items: "object", required: true, description: "Conditions as the filter screen builds them: attribute_key, filter_operator, values, query_operator."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: get_conversation
    action: api/v1/accounts/conversations#show
    route: GET /api/v1/accounts/:account_id/conversations/:id
    title: "Open a conversation"
    description: "One conversation by its number: status, priority, contact, assignee, team, inbox, labels, SLA, custom attributes and ORM's own details such as Zoho tickets and the email category."
    who: everyone
    args:
      - {name: conversation_id, in: path, param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: list_messages
    action: api/v1/accounts/conversations/messages#index
    route: GET /api/v1/accounts/:account_id/conversations/:conversation_id/messages
    title: "Read a conversation's messages"
    description: "A conversation's messages, 20 at a time (older ones with before=<message id>): customer messages, replies, private notes and activity, with attachment details."
    who: everyone
    args:
      - {name: conversation_id, in: path, type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: before, in: query, type: "integer", description: "Only messages older than this message id."}
      - {name: after, in: query, type: "integer", description: "Only messages newer than this message id."}
  - name: list_conversation_attachments
    action: api/v1/accounts/conversations#attachments
    route: GET /api/v1/accounts/:account_id/conversations/:id/attachments
    title: "List a conversation's attachments"
    description: "The files sent in a conversation, newest first, 100 per page: type, name, size and the message each came with. The files themselves stay in ORM."
    who: everyone
    args:
      - {name: conversation_id, in: path, param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: list_conversation_labels
    action: api/v1/accounts/conversations/labels#index
    route: GET /api/v1/accounts/:account_id/conversations/:conversation_id/labels
    title: "List a conversation's labels"
    description: "The labels on one conversation."
    who: everyone
    args:
      - {name: conversation_id, in: path, type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: list_conversation_participants
    action: api/v1/accounts/conversations/participants#show
    route: GET /api/v1/accounts/:account_id/conversations/:conversation_id/participants
    title: "List a conversation's participants"
    description: "The agents taking part in a conversation besides its assignee."
    who: everyone
    args:
      - {name: conversation_id, in: path, type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: get_my_conversation_draft
    action: api/v1/accounts/conversations/draft_messages#show
    route: GET /api/v1/accounts/:account_id/conversations/:conversation_id/draft_messages
    title: "Show my draft reply"
    description: "The person's own unsent reply draft for a conversation, if they left one."
    who: everyone
    args:
      - {name: conversation_id, in: path, type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: list_conversation_events
    action: api/v1/accounts/conversations#reporting_events
    route: GET /api/v1/accounts/:account_id/conversations/:id/reporting_events
    title: "List a conversation's timing events"
    description: "A conversation's reporting events in order: first response, resolutions and reopenings with their times, as the reports count them."
    who: everyone
    args:
      - {name: conversation_id, in: path, param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: get_conversation_assistant
    action: api/v1/accounts/conversations#inbox_assistant
    route: GET /api/v1/accounts/:account_id/conversations/:id/inbox_assistant
    title: "Show the conversation's Captain assistant"
    description: "Which Captain AI assistant answers in the conversation's inbox, if any."
    who: everyone
    feature: captain_integration
    args:
      - {name: conversation_id, in: path, param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - name: search_orm
    action: api/v1/accounts/search#index
    route: GET /api/v1/accounts/:account_id/search
    title: "Search ORM"
    description: "One search across contacts, conversations, messages and help articles, as the search screen does. Conversations and messages only from the person's inboxes."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
  - name: search_conversations
    action: api/v1/accounts/search#conversations
    route: GET /api/v1/accounts/:account_id/search/conversations
    title: "Search conversations"
    description: "Conversations whose number, or whose contact's name, email, phone number or identifier, matches the search, 15 per page. Only the person's inboxes."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: search_messages
    action: api/v1/accounts/search#messages
    route: GET /api/v1/accounts/:account_id/search/messages
    title: "Search messages"
    description: "Messages whose text matches the search, newest first. Only the person's inboxes."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: search_contacts
    action: api/v1/accounts/search#contacts
    route: GET /api/v1/accounts/:account_id/search/contacts
    title: "Search contacts"
    description: "Contacts whose name, email, phone number or identifier matches the search."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: search_help_articles
    action: api/v1/accounts/search#articles
    route: GET /api/v1/accounts/:account_id/search/articles
    title: "Search help articles"
    description: "Help center articles whose title or text matches the search."
    who: everyone
    feature: help_center
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: list_contacts
    action: api/v1/accounts/contacts#index
    route: GET /api/v1/accounts/:account_id/contacts
    title: "List contacts"
    description: "The account's contacts as the Contacts screen lists them, 15 per page, sortable by name, email, phone, last activity or created date, optionally only those with a label."
    who: everyone
    args:
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
      - {name: sort, in: query, type: "string", enum: ["name", "-name", "email", "-email", "phone_number", "-phone_number", "last_activity_at", "-last_activity_at", "created_at", "-created_at", "company", "-company"], description: "Sort order; a leading '-' is descending."}
      - {name: labels, in: query, type: "array", items: "string", description: "Only contacts with these labels."}
  - name: find_contacts
    action: api/v1/accounts/contacts#search
    route: GET /api/v1/accounts/:account_id/contacts/search
    title: "Find contacts"
    description: "Contacts whose name, email, phone number, identifier or company matches the search, sorted and paged as the Contacts screen does (15 per page)."
    who: everyone
    args:
      - {name: q, in: query, type: "string", required: true, maxLength: 200, description: "What to search for."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
      - {name: sort, in: query, type: "string", enum: ["name", "-name", "email", "-email", "phone_number", "-phone_number", "last_activity_at", "-last_activity_at", "created_at", "-created_at", "company", "-company"], description: "Sort order; a leading '-' is descending."}
  - name: filter_contacts
    action: api/v1/accounts/contacts#filter
    route: POST /api/v1/accounts/:account_id/contacts/filter
    title: "Filter contacts"
    description: "Contacts matching conditions on name, email, phone, identifier, location, labels, dates or custom attributes, as the Contacts filter builds them."
    who: everyone
    post: "the body is the filter; it creates nothing"
    args:
      - {name: payload, in: body, type: "array", items: "object", required: true, description: "Conditions as the filter screen builds them: attribute_key, filter_operator, values, query_operator."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: list_online_contacts
    action: api/v1/accounts/contacts#active
    route: GET /api/v1/accounts/:account_id/contacts/active
    title: "List contacts online now"
    description: "Contacts who are online on the website chat right now."
    who: everyone
    args:
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: get_contact
    action: api/v1/accounts/contacts#show
    route: GET /api/v1/accounts/:account_id/contacts/:id
    title: "Show a contact"
    description: "One contact: name, email, phone, identifier, company, location, labels, custom and additional attributes and the inboxes they write from."
    who: everyone
    args:
      - {name: contact_id, in: path, param: "id", type: "integer", required: true}
  - name: list_contactable_inboxes
    action: api/v1/accounts/contacts#contactable_inboxes
    route: GET /api/v1/accounts/:account_id/contacts/:id/contactable_inboxes
    title: "List inboxes that can reach a contact"
    description: "The inboxes a new conversation with this contact could start from, with the contact's id in each."
    who: everyone
    args:
      - {name: contact_id, in: path, param: "id", type: "integer", required: true}
  - name: list_contact_conversations
    action: api/v1/accounts/contacts/conversations#index
    route: GET /api/v1/accounts/:account_id/contacts/:contact_id/conversations
    title: "List a contact's conversations"
    description: "A contact's conversations, newest first. Only those the person can see."
    who: everyone
    args:
      - {name: contact_id, in: path, type: "integer", required: true}
  - name: list_contact_labels
    action: api/v1/accounts/contacts/labels#index
    route: GET /api/v1/accounts/:account_id/contacts/:contact_id/labels
    title: "List a contact's labels"
    description: "The labels on one contact."
    who: everyone
    args:
      - {name: contact_id, in: path, type: "integer", required: true}
  - name: list_contact_notes
    action: api/v1/accounts/contacts/notes#index
    route: GET /api/v1/accounts/:account_id/contacts/:contact_id/notes
    title: "List a contact's notes"
    description: "The notes agents wrote on a contact, newest first, with who wrote each."
    who: everyone
    args:
      - {name: contact_id, in: path, type: "integer", required: true}
  - name: get_contact_note
    action: api/v1/accounts/contacts/notes#show
    route: GET /api/v1/accounts/:account_id/contacts/:contact_id/notes/:id
    title: "Show a contact note"
    description: "One note on a contact."
    who: everyone
    args:
      - {name: contact_id, in: path, type: "integer", required: true}
      - {name: note_id, in: path, param: "id", type: "integer", required: true}
  - name: list_contact_attachments
    action: api/v1/accounts/contacts/attachments#index
    route: GET /api/v1/accounts/:account_id/contacts/:contact_id/attachments
    title: "List a contact's attachments"
    description: "Files from all of a contact's conversations the person can see, newest first, 100 per page. The files themselves stay in ORM."
    who: everyone
    args:
      - {name: contact_id, in: path, type: "integer", required: true}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: find_contact_by_source_id
    action: api/v1/accounts/contact_inboxes#filter
    route: POST /api/v1/accounts/:account_id/contact_inboxes/filter
    title: "Find a contact by channel id"
    description: "The contact behind a channel's own id in one inbox, such as a WhatsApp number or an Instagram user id. Only inboxes the person can see."
    who: everyone
    post: "a lookup by inbox and source id; it creates nothing"
    args:
      - {name: inbox_id, in: body, type: "integer", required: true}
      - {name: source_id, in: body, type: "string", required: true, description: "The channel's own id for the contact, such as a WhatsApp number."}
  - name: list_companies
    action: api/v1/accounts/companies#index
    route: GET /api/v1/accounts/:account_id/companies
    title: "List companies"
    description: "The account's companies with their domain, description and contact count, 25 per page, sortable."
    who: everyone
    feature: companies
  - name: search_companies
    action: api/v1/accounts/companies#search
    route: GET /api/v1/accounts/:account_id/companies/search
    title: "Search companies"
    description: "Companies whose name or domain matches the search."
    who: everyone
    feature: companies
  - name: get_company
    action: api/v1/accounts/companies#show
    route: GET /api/v1/accounts/:account_id/companies/:id
    title: "Show a company"
    description: "One company with its details and custom attributes."
    who: everyone
    feature: companies
    args:
      - {name: company_id, in: path, param: "id", type: "integer", required: true}
  - name: list_company_contacts
    action: api/v1/accounts/companies/contacts#index
    route: GET /api/v1/accounts/:account_id/companies/:company_id/contacts
    title: "List a company's contacts"
    description: "The contacts linked to a company."
    who: everyone
    feature: companies
    args:
      - {name: company_id, in: path, type: "integer", required: true}
  - name: search_company_contacts
    action: api/v1/accounts/companies/contacts#search
    route: GET /api/v1/accounts/:account_id/companies/:company_id/contacts/search
    title: "Search contacts from a company"
    description: "Contacts matching a search by name, email or phone, as a company's page searches them."
    who: everyone
    feature: companies
    args:
      - {name: company_id, in: path, type: "integer", required: true}
  - name: list_company_conversations
    action: api/v1/accounts/companies/conversations#index
    route: GET /api/v1/accounts/:account_id/companies/:company_id/conversations
    title: "List a company's conversations"
    description: "The conversations of a company's contacts. Only those the person can see."
    who: everyone
    feature: companies
    args:
      - {name: company_id, in: path, type: "integer", required: true}
  - name: list_company_notes
    action: api/v1/accounts/companies/notes#index
    route: GET /api/v1/accounts/:account_id/companies/:company_id/notes
    title: "List a company's notes"
    description: "The notes written on a company's contacts."
    who: everyone
    feature: companies
    args:
      - {name: company_id, in: path, type: "integer", required: true}
  - name: list_inboxes
    action: api/v1/accounts/inboxes#index
    route: GET /api/v1/accounts/:account_id/inboxes
    title: "List inboxes"
    description: "The inboxes the person can see (all of them for administrators): channel type, name, greeting, working hours, CSAT and assignment settings. Credentials are never included."
    who: everyone
  - name: get_inbox
    action: api/v1/accounts/inboxes#show
    route: GET /api/v1/accounts/:account_id/inboxes/:id
    title: "Show an inbox"
    description: "One inbox the person can see, with its channel settings. Credentials are never included."
    who: everyone
    args:
      - {name: inbox_id, in: path, param: "id", type: "integer", required: true}
  - name: list_inbox_agents
    action: api/v1/accounts/inbox_members#show
    route: GET /api/v1/accounts/:account_id/inbox_members/:inbox_id
    title: "List an inbox's agents"
    description: "The agents who are members of an inbox the person can see."
    who: everyone
    args:
      - {name: inbox_id, in: path, type: "integer", required: true}
  - name: list_inbox_campaigns
    action: api/v1/accounts/inboxes#campaigns
    route: GET /api/v1/accounts/:account_id/inboxes/:id/campaigns
    title: "List an inbox's campaigns"
    description: "The campaigns that send through one inbox. Administrators only."
    who: admin
    args:
      - {name: inbox_id, in: path, param: "id", type: "integer", required: true}
  - name: get_whatsapp_inbox_health
    action: api/v1/accounts/inboxes#health
    route: GET /api/v1/accounts/:account_id/inboxes/:id/health
    title: "Check a WhatsApp inbox's health"
    description: "Meta's live health check of a WhatsApp inbox: number status, quality rating, messaging limits and errors. Administrators only."
    who: admin
    args:
      - {name: inbox_id, in: path, param: "id", type: "integer", required: true}
  - name: get_inbox_csat_template
    action: api/v1/accounts/inbox_csat_templates#show
    route: GET /api/v1/accounts/:account_id/inboxes/:inbox_id/csat_template
    title: "Show an inbox's CSAT template"
    description: "The WhatsApp customer-satisfaction survey template of an inbox and its approval status at Meta or Twilio."
    who: everyone
    args:
      - {name: inbox_id, in: path, type: "integer", required: true}
  - name: get_inbox_assignment_policy
    action: api/v1/accounts/inboxes/assignment_policies#show
    route: GET /api/v1/accounts/:account_id/inboxes/:inbox_id/assignment_policy
    title: "Show an inbox's assignment policy"
    description: "The automatic-assignment policy an inbox uses. Administrators only."
    who: admin
    args:
      - {name: inbox_id, in: path, type: "integer", required: true}
  - name: list_agents
    action: api/v1/accounts/agents#index
    route: GET /api/v1/accounts/:account_id/agents
    title: "List the agents"
    description: "Everyone in the ORM account: name, display name, email, role (administrator or agent), availability and whether they confirmed their email."
