  - name: get_sla_metrics
    action: api/v1/accounts/applied_slas#metrics
    route: GET /api/v1/accounts/:account_id/applied_slas/metrics
    title: "Show SLA totals"
    description: "How many conversations met or missed their SLA, and the hit rate, for a date range. Administrators only."
    who: admin
    feature: sla
    args:
      - {name: since, in: query, type: "integer", required: true, description: "Start, as Unix seconds."}
      - {name: until, in: query, type: "integer", required: true, description: "End, as Unix seconds."}
  - name: list_reporting_events
    action: api/v1/accounts/reporting_events#index
    route: GET /api/v1/accounts/:account_id/reporting_events
    title: "List reporting events"
    description: "The account's reporting events (first responses, resolutions, reopenings) with their times, for a date range. Administrators only."
    who: admin
    args:
      - {name: since, in: query, type: "integer", required: true, description: "Start, as Unix seconds."}
      - {name: until, in: query, type: "integer", required: true, description: "End, as Unix seconds."}
      - {name: page, in: query, type: "integer", minimum: 1, description: "Page number, from 1."}
  - name: get_follow_up_report
    action: api/v1/accounts/follow_up_reports#show
    route: GET /api/v1/accounts/:account_id/follow_up_report
    title: "Show the follow-ups report"
    description: "Open and in-range conversation counts for each follow-up label the administrators chose. Needs report access."
    who: reports
  - name: get_forwarded_email_report
    action: api/v1/accounts/forwarded_email_reports#show
    route: GET /api/v1/accounts/:account_id/forwarded_email_report
    title: "Show the forwarded emails report"
    description: "The weekly Forwarded Emails report for one email category: each customer email first forwarded to a team that week, who got it and what came of it. Needs report access."
    who: reports
    args:
      - {name: category, in: query, type: "string", required: true}
      - {name: week, in: query, type: "string", pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Any day of the week (India time); last week unless given."}
  - name: list_forwarded_email_categories
    action: api/v1/accounts/forwarded_email_reports#categories
    route: GET /api/v1/accounts/:account_id/forwarded_email_report/categories
    title: "List forwarded email categories"
    description: "The email categories the Forwarded Emails report covers, from the bridge's routing rules. Needs report access."
    who: reports
  - name: get_my_year_in_review
    action: api/v2/accounts/year_in_reviews#show
    route: GET /api/v2/accounts/:account_id/year_in_review
    title: "Show my year in review"
    description: "The person's Year in Review for one year: conversations handled, busiest times and highlights."
    who: everyone
    args:
      - {name: year, in: query, type: "integer", description: "The year; 2025 unless given."}
# write: every write route. Offered: a full entry (title, description, who, args, flags) that an AI connection with Full access
#   (pass max_level administer) may call, if ORM's own policies allow the person; `guard` names an extra check before the route runs
#   (DurianOs::Ai::WriteGuard), `fixed` pins body values (a private note is private: true), `destructive` asks the AI to confirm first.
#   Refused: `refused: <reason>` (customer, outside, bulk, deletion, settings, later; the words are in DurianOs::Ai::Registry::WRITE_REFUSED_REASONS).
write:
  - {name: update_account_settings, action: api/v1/accounts#update, route: "PATCH|PUT /api/v1/accounts/:id", who: admin, refused: settings}
  - {name: start_conversation, action: api/v1/accounts/conversations#create, route: "POST /api/v1/accounts/:account_id/conversations", who: everyone, refused: customer}
  - {name: update_conversation, action: api/v1/accounts/conversations#update, route: "PATCH|PUT /api/v1/accounts/:account_id/conversations/:id", who: everyone, refused: later}
  - {name: delete_conversation, action: api/v1/accounts/conversations#destroy, route: "DELETE /api/v1/accounts/:account_id/conversations/:id", who: admin, refused: deletion}
  - {name: mute_conversation, action: api/v1/accounts/conversations#mute, route: "POST /api/v1/accounts/:account_id/conversations/:id/mute", who: everyone, note: "Chatwoot resolves the conversation (it can send the customer the survey) and blocks the contact", refused: customer}
  - name: unmute_conversation
    action: api/v1/accounts/conversations#unmute
    route: POST /api/v1/accounts/:account_id/conversations/:id/unmute
    title: "Unmute a conversation"
    description: "Unmutes a conversation: the contact is unblocked. It does not reopen it. Only conversations the person can see."
    who: everyone
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
  - {name: email_conversation_transcript, action: api/v1/accounts/conversations#transcript, route: "POST /api/v1/accounts/:account_id/conversations/:id/transcript", who: everyone, note: "sends email", refused: customer}
  - name: set_conversation_status
    action: api/v1/accounts/conversations#toggle_status
    route: POST /api/v1/accounts/:account_id/conversations/:id/toggle_status
    title: "Change a conversation's status"
    description: "Opens, snoozes or marks pending a conversation; a status is always required. Resolving stays in ORM: it can send the customer the inbox's satisfaction survey."
    who: everyone
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "status", in: "body", type: "string", required: true, enum: ["open", "pending", "snoozed"], description: "The new status."}
      - {name: "snoozed_until", in: "body", type: "string", description: "For snoozed: when to wake it, such as 2026-11-12T09:00:00Z. Left out, it stays snoozed until the customer replies."}
  - name: set_conversation_priority
    action: api/v1/accounts/conversations#toggle_priority
    route: POST /api/v1/accounts/:account_id/conversations/:id/toggle_priority
    title: "Set a conversation's priority"
    description: "Sets the priority of a conversation. Leave priority out to clear it. Only conversations the person can see."
    who: everyone
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "priority", in: "body", type: "string", enum: ["urgent", "high", "medium", "low"], description: "The priority; leave out to clear it."}
  - {name: mark_conversation_unread, action: api/v1/accounts/conversations#unread, route: "POST /api/v1/accounts/:account_id/conversations/:id/unread", who: everyone, refused: later}
  - name: set_conversation_attributes
    action: api/v1/accounts/conversations#custom_attributes
    route: POST /api/v1/accounts/:account_id/conversations/:id/custom_attributes
    title: "Set a conversation's custom attributes"
    description: "Sets values of the account's custom conversation attributes, by attribute key; a key set to null is removed. Other keys of the conversation are kept, and keys that are not defined attributes are refused."
    who: everyone
    guard: conversation_attributes
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", param: "id", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "custom_attributes", in: "body", type: "object", required: true, description: "Attribute key to value, such as {\"order_number\": \"A-1042\"}."}
  - name: add_private_note
    action: api/v1/accounts/conversations/messages#create
    route: POST /api/v1/accounts/:account_id/conversations/:conversation_id/messages
    title: "Add a private note to a conversation"
    description: "Adds a private note that only agents see; it is never sent to the customer. An AI connection cannot send replies to customers: that stays in ORM."
    who: everyone
    fixed: {private: true}
    fixed_refusal: "An AI connection can only add private notes to a conversation. Replies and other messages that reach a customer stay in ORM for now."
    args:
      - {name: "conversation_id", in: "path", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "content", in: "body", type: "string", required: true, maxLength: 5000, description: "The note, as text."}
  - {name: update_message_status, action: api/v1/accounts/conversations/messages#update, route: "PATCH|PUT /api/v1/accounts/:account_id/conversations/:conversation_id/messages/:id", who: everyone, refused: later}
  - {name: delete_message, action: api/v1/accounts/conversations/messages#destroy, route: "DELETE /api/v1/accounts/:account_id/conversations/:conversation_id/messages/:id", who: everyone, refused: deletion}
  - {name: translate_message, action: api/v1/accounts/conversations/messages#translate, route: "POST /api/v1/accounts/:account_id/conversations/:conversation_id/messages/:id/translate", who: everyone, note: "calls Google Translate and stores the translation", refused: outside}
  - {name: retry_message, action: api/v1/accounts/conversations/messages#retry, route: "POST /api/v1/accounts/:account_id/conversations/:conversation_id/messages/:id/retry", who: everyone, refused: customer}
  - {name: mark_ai_suggestion_sent, action: api/v1/accounts/conversations/messages#mark_suggestion_sent, route: "POST /api/v1/accounts/:account_id/conversations/:conversation_id/messages/:id/mark_suggestion_sent", who: everyone, refused: later}
  - name: assign_conversation
    action: api/v1/accounts/conversations/assignments#create
    route: POST /api/v1/accounts/:account_id/conversations/:conversation_id/assignments
    title: "Assign a conversation"
    description: "Assigns a conversation to an agent or to a team, as the screen does. Take the agent id from list_assignable_agents and the team id from list_teams. Give one of them. Taking an assignment away, and assigning the DurianAI bot, stay in ORM."
    who: everyone
    guard: assignment
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "assignee_id", in: "body", type: "integer", description: "The agent to assign."}
      - {name: "team_id", in: "body", type: "integer", description: "The team to assign."}
  - name: set_conversation_labels
    action: api/v1/accounts/conversations/labels#create
    route: POST /api/v1/accounts/:account_id/conversations/:conversation_id/labels
    title: "Set a conversation's labels"
    description: "Replaces a conversation's labels with exactly this list (read its labels first and send them all back to add one)."
    who: everyone
    guard: labels_known
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "labels", in: "body", type: "array", items: "string", required: true, description: "Label names; labels that are not in the list already must exist in ORM."}
  - name: add_conversation_participants
    action: api/v1/accounts/conversations/participants#create
    route: POST /api/v1/accounts/:account_id/conversations/:conversation_id/participants
    title: "Add participants to a conversation"
    description: "Adds agents as participants of a conversation, so they follow it. Nothing is sent to the customer."
    who: everyone
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "user_ids", in: "body", type: "array", items: "integer", required: true, description: "Agent ids."}
  - {name: set_conversation_participants, action: api/v1/accounts/conversations/participants#update, route: "PATCH|PUT /api/v1/accounts/:account_id/conversations/:conversation_id/participants", who: everyone, refused: later}
  - name: remove_conversation_participants
    action: api/v1/accounts/conversations/participants#destroy
    route: DELETE /api/v1/accounts/:account_id/conversations/:conversation_id/participants
    title: "Remove participants from a conversation"
    description: "Removes agents from the participants of a conversation. They stay agents; they just stop following it."
    who: everyone
    destructive: true
    idempotent: true
    args:
      - {name: "conversation_id", in: "path", type: "integer", required: true, description: "The conversation number shown in ORM (its display id)."}
      - {name: "user_ids", in: "body", type: "array", items: "integer", required: true, description: "Agent ids."}
  - {name: save_my_conversation_draft, action: api/v1/accounts/conversations/draft_messages#update, route: "PATCH|PUT /api/v1/accounts/:account_id/conversations/:conversation_id/draft_messages", who: everyone, refused: later}
  - {name: discard_my_conversation_draft, action: api/v1/accounts/conversations/draft_messages#destroy, route: "DELETE /api/v1/accounts/:account_id/conversations/:conversation_id/draft_messages", who: everyone, refused: later}
  - {name: bulk_update_conversations, action: api/v1/accounts/bulk_actions#create, route: "POST /api/v1/accounts/:account_id/bulk_actions", who: everyone, refused: bulk}
  - name: create_contact
    action: api/v1/accounts/contacts#create
    route: POST /api/v1/accounts/:account_id/contacts
    title: "Create a contact"
    description: "Creates a contact with a name, email, phone number or identifier, and attributes. Search first (find_contacts) so a person is not added twice."
    who: everyone
    guard: contact_attributes
    args:
      - {name: "name", in: "body", type: "string", description: "The contact's name."}
      - {name: "email", in: "body", type: "string", description: "Email address."}
      - {name: "phone_number", in: "body", type: "string", description: "Phone number with country code, such as +919800000000."}
      - {name: "identifier", in: "body", type: "string", description: "The contact's own identifier, if any."}
      - {name: "blocked", in: "body", type: "boolean", description: "Whether the contact is blocked."}
      - {name: "additional_attributes", in: "body", type: "object", description: "Details such as city, country, company_name and description."}
      - {name: "custom_attributes", in: "body", type: "object", description: "Values for the account's custom contact attributes, by attribute key."}
  - name: update_contact
    action: api/v1/accounts/contacts#update
    route: PATCH /api/v1/accounts/:account_id/contacts/:id
    title: "Update a contact's details"
    description: "Changes a contact's name, email, phone number, identifier, blocked flag or attributes. Fields left out are kept; attribute values are merged."
    who: everyone
    guard: contact_attributes
    idempotent: true
    args:
      - {name: "contact_id", in: "path", param: "id", type: "integer", required: true}
      - {name: "name", in: "body", type: "string", description: "The contact's name."}
      - {name: "email", in: "body", type: "string", description: "Email address."}
      - {name: "phone_number", in: "body", type: "string", description: "Phone number with country code, such as +919800000000."}
      - {name: "identifier", in: "body", type: "string", description: "The contact's own identifier, if any."}
      - {name: "blocked", in: "body", type: "boolean", description: "Whether the contact is blocked."}
      - {name: "additional_attributes", in: "body", type: "object", description: "Details such as city, country, company_name and description."}
      - {name: "custom_attributes", in: "body", type: "object", description: "Values for the account's custom contact attributes, by attribute key."}
  - {name: delete_contact, action: api/v1/accounts/contacts#destroy, route: "DELETE /api/v1/accounts/:account_id/contacts/:id", who: admin, refused: deletion}
  - name: remove_contact_attributes
    action: api/v1/accounts/contacts#destroy_custom_attributes
    route: POST /api/v1/accounts/:account_id/contacts/:id/destroy_custom_attributes
    title: "Remove a contact's custom attributes"
    description: "Removes the given custom attribute values from a contact. The values are lost."
    who: everyone
    guard: contact_attributes
    destructive: true
    idempotent: true
    args:
      - {name: "contact_id", in: "path", param: "id", type: "integer", required: true}
      - {name: "custom_attributes", in: "body", type: "array", items: "string", required: true, description: "Attribute keys to remove."}
  - {name: add_contact_to_inbox, action: api/v1/accounts/contacts/contact_inboxes#create, route: "POST /api/v1/accounts/:account_id/contacts/:contact_id/contact_inboxes", who: everyone, refused: later}
  - name: set_contact_labels
    action: api/v1/accounts/contacts/labels#create
    route: POST /api/v1/accounts/:account_id/contacts/:contact_id/labels
    title: "Set a contact's labels"
    description: "Replaces a contact's labels with exactly this list (read its labels first and send them all back to add one)."
    who: everyone
    guard: labels_known
    idempotent: true
    args:
      - {name: "contact_id", in: "path", type: "integer", required: true}
      - {name: "labels", in: "body", type: "array", items: "string", required: true, description: "Label names; labels that are not in the list already must exist in ORM."}
  - name: add_contact_note
    action: api/v1/accounts/contacts/notes#create
    route: POST /api/v1/accounts/:account_id/contacts/:contact_id/notes
    title: "Add a note to a contact"
    description: "Adds a note to a contact. Notes are seen by agents only."
    who: everyone
    args:
      - {name: "contact_id", in: "path", type: "integer", required: true}
      - {name: "content", in: "body", type: "string", required: true, maxLength: 5000, description: "The note."}
  - name: update_contact_note
    action: api/v1/accounts/contacts/notes#update
    route: PATCH /api/v1/accounts/:account_id/contacts/:contact_id/notes/:id
    title: "Change a contact's note"
    description: "Rewrites a note on a contact; the old text is replaced."
    who: everyone
    destructive: true
    idempotent: true
    args:
      - {name: "contact_id", in: "path", type: "integer", required: true}
      - {name: "note_id", in: "path", param: "id", type: "integer", required: true}
      - {name: "content", in: "body", type: "string", required: true, maxLength: 5000, description: "The new text."}
  - name: delete_contact_note
    action: api/v1/accounts/contacts/notes#destroy
    route: DELETE /api/v1/accounts/:account_id/contacts/:contact_id/notes/:id
    title: "Delete a contact's note"
    description: "Deletes a note from a contact. It cannot be undone."
    who: everyone
    destructive: true
    idempotent: true
    args:
      - {name: "contact_id", in: "path", type: "integer", required: true}
      - {name: "note_id", in: "path", param: "id", type: "integer", required: true}
  - name: merge_contacts
    action: api/v1/accounts/actions/contact_merges#create
    route: POST /api/v1/accounts/:account_id/actions/contact_merge
    title: "Merge two contacts"
    description: "Merges the second contact into the first: conversations, notes and details move to the first and the second contact is deleted. It cannot be undone."
    who: everyone
    destructive: true
    args:
      - {name: "base_contact_id", in: "body", type: "integer", required: true, description: "The contact that stays."}
      - {name: "mergee_contact_id", in: "body", type: "integer", required: true, description: "The contact merged in and deleted."}
  - name: create_company
    action: api/v1/accounts/companies#create
    route: POST /api/v1/accounts/:account_id/companies
    title: "Create a company"
    description: "Creates a company with a name, domain and description."
    who: everyone
    feature: companies
    args:
      - {name: "name", in: "body", type: "string", required: true, description: "The company's name."}
      - {name: "domain", in: "body", type: "string", description: "Web domain, such as example.com."}
      - {name: "description", in: "body", type: "string", maxLength: 2000}
  - name: update_company
    action: api/v1/accounts/companies#update
    route: PATCH /api/v1/accounts/:account_id/companies/:id
    title: "Update a company's details"
    description: "Changes a company's name, domain or description. Fields left out are kept."
    who: everyone
    feature: companies
    idempotent: true
    args:
      - {name: "company_id", in: "path", param: "id", type: "integer", required: true}
      - {name: "name", in: "body", type: "string"}
      - {name: "domain", in: "body", type: "string"}
      - {name: "description", in: "body", type: "string", maxLength: 2000}
  - {name: delete_company, action: api/v1/accounts/companies#destroy, route: "DELETE /api/v1/accounts/:account_id/companies/:id", who: admin, refused: deletion}
  - {name: remove_company_attributes, action: api/v1/accounts/companies#destroy_custom_attributes, route: "POST /api/v1/accounts/:account_id/companies/:id/destroy_custom_attributes", who: everyone, refused: later}
  - name: add_contact_to_company
    action: api/v1/accounts/companies/contacts#create
    route: POST /api/v1/accounts/:account_id/companies/:company_id/contacts
    title: "Add a contact to a company"
    description: "Links a contact to a company."
    who: everyone
    feature: companies
    idempotent: true
    args:
      - {name: "company_id", in: "path", type: "integer", required: true}
      - {name: "contact_id", in: "body", type: "integer", required: true}
  - name: remove_contact_from_company
    action: api/v1/accounts/companies/contacts#destroy
    route: DELETE /api/v1/accounts/:account_id/companies/:company_id/contacts/:id
    title: "Remove a contact from a company"
    description: "Unlinks a contact from a company. Neither is deleted."
    who: everyone
    feature: companies
    idempotent: true
    args:
      - {name: "company_id", in: "path", type: "integer", required: true}
      - {name: "contact_id", in: "path", param: "id", type: "integer", required: true}
  - {name: update_inbox_settings, action: api/v1/accounts/inboxes#update, route: "PATCH|PUT /api/v1/accounts/:account_id/inboxes/:id", who: admin, note: "a future write must refuse channel credentials", refused: settings}
  - {name: delete_inbox, action: api/v1/accounts/inboxes#destroy, route: "DELETE /api/v1/accounts/:account_id/inboxes/:id", who: admin, refused: settings}
  - {name: sync_inbox_whatsapp_templates, action: api/v1/accounts/inboxes#sync_templates, route: "POST /api/v1/accounts/:account_id/inboxes/:id/sync_templates", who: admin, refused: outside}
  - {name: create_inbox_csat_template, action: api/v1/accounts/inbox_csat_templates#create, route: "POST /api/v1/accounts/:account_id/inboxes/:inbox_id/csat_template", who: admin, refused: outside}
  - {name: analyze_csat_template, action: api/v1/accounts/inbox_csat_templates#analyze, route: "POST /api/v1/accounts/:account_id/inboxes/:inbox_id/csat_template/analyze", who: everyone, note: "runs a Captain model call", refused: outside}
  - {name: update_inbox_working_hours, action: api/v1/accounts/working_hours#update, route: "PATCH|PUT /api/v1/accounts/:account_id/working_hours/:id", who: admin, refused: settings}
  - {name: create_team, action: api/v1/accounts/teams#create, route: "POST /api/v1/accounts/:account_id/teams", who: admin, refused: settings}
  - {name: update_team, action: api/v1/accounts/teams#update, route: "PATCH|PUT /api/v1/accounts/:account_id/teams/:id", who: admin, refused: settings}
  - {name: delete_team, action: api/v1/accounts/teams#destroy, route: "DELETE /api/v1/accounts/:account_id/teams/:id", who: admin, refused: settings}
  - {name: create_assignment_policy, action: api/v1/accounts/assignment_policies#create, route: "POST /api/v1/accounts/:account_id/assignment_policies", who: admin, refused: settings}
