    include_customer_in_cc: false
    forward_to: marketing@durian.in
    note: govt/private sector split → existing crm_owner_routing_govt_bulk / _private matrix
    sector_keywords:
      government:
      - Ministry, Department, Directorate, Bureau, Secretariat, Office of the… — e.g. "Department of Posts",
        "Directorate of Education"
      - Government of / Govt. of / Govt of India / State Government + a state name
      - Municipal Corporation, Municipality, Nagar Nigam, Nagar Palika, Panchayat, Zilla Parishad, Gram
        Panchayat
      - Collectorate, District Office, Tehsil, Block Office, Sub-Divisional
      - Council (e.g. City Council, Research Council), Board (e.g. Electricity Board, Housing Board, Pollution
        Control Board, Examination Board)
      - Commission (e.g. Election Commission, UPSC, State PSC, Human Rights Commission)
      - Authority (e.g. Development Authority/DDA, Port Authority, Airports Authority/AAI, NHAI, Water
        Authority)
      - Corporation when public-sector — BSNL, ONGC, NTPC, SAIL, GAIL, BHEL, LIC, Coal India, FCI, etc.
        (the PSU names)
      - Bhavan / Bhawan / Sadan / Karyalaya (Hindi for office/building, common in govt naming)
      - Institute / Institution when prefixed by national/central — AIIMS, IIT, IIM, NIT, IISc, ICAR,
        ISRO, DRDO, CSIR labs
      - University (most are state/central public), Vidyalaya (Kendriya Vidyalaya, Navodaya), Vidyapeeth
      - Police, Defence, Army, Navy, Air Force, Cantonment, CRPF/CISF/BSF, Ordnance
      - Railways, Indian Railways, Zonal Railway, Metro Rail / Metro Corporation
      - Court, High Court, District Court, Judiciary, Tribunal, Bar Council
      - Hospital / Medical College when prefixed Government/Civil/District/General/ESI
      - Reserve Bank / RBI, Public Sector Bank names (SBI, PNB, Canara, etc.), NABARD, SIDBI
      - Mission, Yojana, Samiti, Parishad, Sabha, Ayog, Mandal, Nigam, Vibhag (Hindi institutional terms)
      - Raj Bhavan, Vidhan Sabha, Lok Sabha, Rajya Sabha, Assembly, Legislature
      - 'Abbreviation/email patterns: .gov.in, .nic.in, .ac.in (the last is education — often but not
        always public)'
      - Cabinet Supply
      - Bulk Order
      - Quotation for Bulk Order/ Ongoing Project
      - GeM Portal
      - Central Government Supplies
      - GeM Authorization
      - OEM Authorization
      private:
      - Pvt. Ltd. / Private Limited, LLP, & Co., & Sons, & Associates, Enterprises, Ventures, Holdings
      - Ltd. / Limited without a PSU name — usually a private public-listed company
      - Inc., Corp., GmbH, Pte. Ltd. — foreign/MNC entities
      - Solutions, Technologies, Systems, Software, Labs, Digital, Infotech, Consulting, Consultancy,
        Services, Group
      - Industries, Manufacturing, Mills, Works, Trading, Exports, Imports, Traders
      - Realty, Builders, Developers, Estates, Infra, Construction, Properties, Constructions
      - Studio, Designs, Architects, Interiors, Creatives, Media, Agency
      - Hospitality, Hotels, Resorts, Retail, Mart, Stores, Bazaar
      - Clinic, Nursing Home, Diagnostics without a Govt/Civil prefix — usually private healthcare
      - Startup-style coined names (made-up words, camelCase, English brand names without institutional
        terms)
      - 'Email patterns: company.com, .co.in, gmail.com, outlook.com, or a custom brand domain'
