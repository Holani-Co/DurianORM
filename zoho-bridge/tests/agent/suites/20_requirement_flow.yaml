# 3 · Name confirmed before the deal
- id: p2_profile_name_is_confirmed_first
  inbox: durianforhome
  contact:
    id: 900
    name: Rajeshri Patil
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to buy the Lewis corner sofa. 9560150835, pincode 110054
    expect:
      sent_contains:
      - Rajeshri
      - \?
  expect:
    handled: agent_sent
    deal_not_created: true

# 3 · Name confirmed before the deal
- id: p2_name_confirmed_then_deal
  inbox: durianforhome
  contact:
    id: 900
    name: Rajeshri Patil
  config:
    STORE_LOCATOR_ENABLED: true
  script:
