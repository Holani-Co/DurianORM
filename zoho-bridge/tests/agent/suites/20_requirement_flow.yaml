# 1 · What they want, not which account
- id: p2_store_asked_requirement_unknown
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: Do you have a store in Delhi?
  expect:
    handled: agent_sent
    sent_contains:
    - looking for|customi[sz]e|requirement|interested in|plan\b|planning|help you|would you like
    sent_not_contains:
