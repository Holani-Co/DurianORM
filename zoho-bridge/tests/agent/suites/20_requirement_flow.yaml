# Part 2 of the agent redesign: the product line comes from the conversation, one
# enquiry skill for every line, the name is confirmed before the deal, one deal per
# line, later details go onto the deal. One designed conversation per rule decided by
# Vaibhav on 2026-10-12/13 (built on his "do it"; the cases were not individually
# marked on the review page).

# 1 · What they want, not which account
- id: p2_doors_store_asked_on_furniture_account
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: Do you have a doors showroom in Gurgaon?
  expect:
    handled: agent_sent
    sent_contains:
    - MG Road
    sent_not_contains:
    - Sohna Road
    - Gurgaon JMD

# 1 · What they want, not which account
- id: p2_sofa_store_asked_on_doors_account
  inbox: duriandoor
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to see sofas. Which showroom is near pincode 110054?
  expect:
    handled: agent_sent
    sent_contains:
    - Kirti Nagar
    - Raghvendra
    sent_not_contains:
    - Rohit

