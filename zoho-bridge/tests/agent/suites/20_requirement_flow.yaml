# 4 · One deal per vertical
- id: p2_sofa_and_chairs_one_deal
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to buy the Lewis corner sofa. I am Rahul Verma, 9560150835, pincode 110054
  - at: 2m
    text: I also need 4 dining chairs
  expect:
    deal_count: 1
    deal_lines:
    - furniture
    deal_notes_contains:
    - chair

# 4 · One deal per vertical
- id: p2_sofa_and_doors_two_deals
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to buy the Lewis corner sofa. I am Rahul Verma, 9560150835, pincode 110054
  - at: 2m
    text: I also need 5 veneer doors for the same flat
  expect:
    deal_count: 2
    deal_lines:
    - furniture
    - doors
    sent_not_contains:
    - contact number|phone number|mobile number

# 4 · One deal per vertical
- id: p2_sofa_and_custom_wardrobe_two_deals
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
