# 2 · One enquiry step, asks for everything missing
- id: p2_everything_missing_is_asked_at_once
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to buy the Lewis corner sofa
    expect:
      sent_contains:
      - name
      - contact number|phone number|mobile number
      - pincode|city
  expect:
    handled: agent_sent
    deal_not_created: true

# 2 · One enquiry step, asks for everything missing
- id: p2_only_the_missing_piece_is_asked
  inbox: duriandoor
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I need 5 veneer doors. I am Rahul Verma, my number is 9560150835
  expect:
    handled: agent_sent
    sent_contains:
    - pincode|city
    sent_not_contains:
    - contact number|phone number|mobile number
    - full name
    deal_not_created: true

# 2 · One enquiry step, asks for everything missing
- id: p2_furniture_all_details_one_message
  inbox: durianforhome
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I want to buy the Lewis corner sofa. I am Rahul Verma, 9560150835, pincode 110054
  expect:
    deal_count: 1
    deal_lines:
    - furniture
    sent_contains:
    - Kirti Nagar
