# #9868 · P02 · Customer details not asked
- id: fb9868_fhc_wardrobe_store_delhi
  inbox: durian_fullhomecustomisation
  contact:
    id: 900
    name: Priya
  config:
    STORE_LOCATOR_ENABLED: true
  script:
  - at: 0m
    text: I am looking for Modular wardrobe & lifestyle system, do you have store in DELHI city?
  - at: 2m
    text: Also note please register enquiry with name Ms. Priya & my pin code is 110021.
  expect:
    handled: agent_sent
    labels_absent:
    - agent-needed
    sent_contains:
    - Kirti Nagar
    - contact number|phone number|mobile number
    deal_not_created: true
    judge:
      min: 3

