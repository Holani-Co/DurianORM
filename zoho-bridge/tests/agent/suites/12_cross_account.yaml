- id: sofa_on_doors_account
  inbox: duriandoor
  script:
    - {at: "0m", text: "I want an L-shaped sofa. pincode 110054, call me on 9560150835"}
  expect:
    sent_not_contains: ["wrong account", "different page", "cannot help with sofas"]
    anywhere_contains: ["corner|sofa"]
    judge: {min: 3}

