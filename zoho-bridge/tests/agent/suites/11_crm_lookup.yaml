- id: crm_found_remembered
  crm:
    contact: {id: "CRM-77", Full_Name: "Vaibhav Holani"}
    deals:
      - {Deal_Name: "Sofa purchase 2025", Stage: "Closed Won"}
  script:
    - {at: "0m", text: "I want the benjamin corner sofa. my number is 9560150835, pincode 110054"}
  expect:
    profile_field: {commercial.crm_contact_id: "CRM-77"}
    deal_created: true
    judge: {min: 3}

