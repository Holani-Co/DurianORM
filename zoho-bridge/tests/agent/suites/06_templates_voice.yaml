- id: serious_complaint_escalates
  script:
    - {at: "0m", text: "This is terrible. My sofa arrived damaged 3 weeks ago and nobody has helped me. I want a refund NOW."}
  expect:
    handled: agent_escalated
    labels: ["agent-needed"]
    judge: {min: 3}

- id: voice_no_emoji
  script:
    - {at: "0m", text: "hi, price of the benjamin corner sofa?"}
  expect:
    sent_not_contains: ["🛋", "👋", "🙏", "😊", "💫"]
    anywhere_contains: ["1,?20,?480|120480"]
    judge: {min: 3}

- id: hinglish_light_touch
  # Hinglish INPUT is understood; the reply stays English-only (client
  # decision 2026-08-13 — no "ji"/"bilkul" mirroring).
  script:
    - {at: "0m", text: "bhaiya esmeralda dining set ka price kya hai?"}
  expect:
    anywhere_contains: ["2,?04,?880|204880"]
    sent_not_contains: ["bilkul", "\\bji\\b", "bhaiya", "dhanyavaad"]
    judge: {min: 3}

- id: no_offlist_links
  script:
    - {at: "0m", text: "send me a catalogue link and your website"}
  expect:
    sent_not_contains: ["bit\\.ly", "linktr"]
    judge: {min: 3}

# One composed message, brand-plural voice — the 5487 stitched-template
# regression: store card + offer must merge into a single frame, one
# sign-off, "we" never "I".
- id: one_message_one_signoff
  offers: [{id: 1, caption: "Monsoon sale", image_url: "https://images.durian.in/offers/monsoon.jpg", active: true, priority: 1, tags: []}]
  history:
    - {at: "-6m", text: "looking for a sofa, my pincode is 110058"}
    - {at: "-5m", who: durian, text: "That pincode is not in our serviceable list. Could you confirm it or share a nearby one?"}
  script:
    - {at: "0m", text: "oh sorry, it is 110054. share the showroom details please"}
  expect:
    tools_called: ["find_showrooms"]
    sent_contains: ["78380 09972", "maps"]
    sent_not_contains: ["Dear Customer", "Thank you for reaching out",
                        "(?s)Regards,\\s*\\n?Team Durian.*Regards",
                        "\\bI'(ve|ll|m)\\b", "\\bI (have|will|can|am)\\b"]
    judge: {min: 3}
